id: grader-l3-no-secrets
level: 3
description: Detect secrets, tokens, API keys, private keys (security hygiene)
rules:
  - id: rule-no-aws-keys
    check: no_secrets_pattern
    patterns:
      - "AKIA[0-9A-Z]{16}"
      - "aws_secret_access_key"
      - "ASIAZ[0-9A-Z]{16}"
    threshold: 1.0
  - id: rule-no-api-keys
    check: no_secrets_pattern
    patterns:
      - "(api_key|apiKey|API_KEY)\\s*="
      - "stripe_sk_live_"
      - "sk_live_"
    threshold: 1.0
  - id: rule-no-private-keys
    check: no_secrets_pattern
    patterns:
      - "-----BEGIN.*PRIVATE KEY-----"
      - "-----BEGIN RSA PRIVATE KEY-----"
    threshold: 1.0
